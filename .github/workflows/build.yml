name: Build

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_VERSION: v1.7.6

jobs:
  # Speech recogniser for voice questions. Built on an older Ubuntu so the binary runs
  # on SteamOS's newer glibc; Zen 2 in the Deck has AVX2/FMA/F16C.
  whisper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: whisper-cli
          key: whisper-cli-${{ env.WHISPER_VERSION }}-zen2-1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF -DWHISPER_CURL=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build --target whisper-cli -j 4
          cp build/bin/whisper-cli whisper-cli
          strip whisper-cli
      - run: |
          ls -la whisper-cli
          ldd whisper-cli
          if ldd whisper-cli | grep -vE 'linux-vdso|libc\.so|libm\.so|libpthread|libdl|ld-linux|librt'; then
            echo "unexpected shared library dependency"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cli
          path: whisper-cli

  build:
    needs: whisper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whisper-cli
          path: bin
      - run: chmod +x bin/whisper-cli && bin/whisper-cli --help 2>&1 | head -3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q gstreamer1.0-tools gstreamer1.0-plugins-base
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: python tests/test_offline.py
      - name: Voice smoke test (downloads, speech synthesis, recognition)
        run: python tests/test_voice.py
      - run: pnpm run build && python scripts/package.py
      - run: unzip -l out/deck-mentor.zip
      - uses: actions/upload-artifact@v4
        with:
          name: deck-mentor
          path: out/deck-mentor.zip
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Every push to main publishes out/deck-mentor.zip as release v<package.json version>,
      # so the stable install URL is .../releases/latest/download/deck-mentor.zip
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Deck Mentor v${{ steps.version.outputs.version }}
          make_latest: true
          files: out/deck-mentor.zip
          body: |
            Установка: Decky → Настройки → «Установить плагин по URL» и вставить
            https://github.com/FPSarmin/deck-mentor/releases/latest/download/deck-mentor.zip
            Перед этим один раз установите Claude Code и войдите через /login (см. README).
            Если плагин уже стоит, обновиться можно прямо из его панели.
