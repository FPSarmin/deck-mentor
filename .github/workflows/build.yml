name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q gstreamer1.0-tools gstreamer1.0-plugins-base
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: python tests/test_offline.py
      - run: pnpm run build && python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: deck-mentor
          path: out/deck-mentor.zip
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Every push to main publishes out/deck-mentor.zip as release v<package.json version>,
      # so the stable install URL is .../releases/latest/download/deck-mentor.zip
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Deck Mentor v${{ steps.version.outputs.version }}
          make_latest: true
          files: out/deck-mentor.zip
          body: |
            Установка: Decky → Настройки → «Установить плагин по URL» и вставить
            https://github.com/FPSarmin/deck-mentor/releases/latest/download/deck-mentor.zip
            Перед этим один раз установите Claude Code и войдите через /login (см. README).
