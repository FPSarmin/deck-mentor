name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q gstreamer1.0-tools gstreamer1.0-plugins-base
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: python tests/test_offline.py
      - run: pnpm run build && python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: deck-mentor
          path: out/deck-mentor.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/deck-mentor.zip
